<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Warung Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #4CAF50;
            --accent-to: #8BC34A;
        }
        .gradient-bg { background: linear-gradient(135deg, var(--accent-from), var(--accent-to)); }
        .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .input-field {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .input-field::placeholder {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md glass p-8 rounded-lg shadow-xl">
        <h1 class="text-3xl font-bold text-center mb-6 gradient-text">Aplikasi Warung Enterprise</h1>
        <h2 class="text-2xl font-semibold text-center mb-8">Masuk</h2>

        <form id="loginForm">
            <div class="mb-5">
                <label for="username" class="block text-sm font-medium mb-2">Nama Pengguna</label>
                <input type="text" id="username" name="username" required class="input-field w-full px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Masukkan nama pengguna">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium mb-2">Kata Sandi</label>
                <input type="password" id="password" name="password" required class="input-field w-full px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Masukkan kata sandi">
            </div>
            <div class="mb-6 flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-green-500 focus:ring-green-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-300">Ingat Saya</label>
                </div>
                <a href="#" class="text-sm text-green-400 hover:underline">Lupa Kata Sandi?</a>
            </div>
            <button type="submit" class="w-full glass px-6 py-3 rounded-md font-semibold hover:bg-white hover:text-gray-900 transition gradient-bg focus:outline-none focus:ring-2 focus:ring-green-400">
                Masuk
            </button>
        </form>

        <div class="text-center mt-8">
            <p class="text-sm text-gray-400">Belum punya akun? <a href="/register.html" class="text-green-400 hover:underline">Daftar</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            // Basic validation (replace with actual auth logic)
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username && password) {
                // Simulate successful login
                alert('Login berhasil! Mengarahkan ke dashboard...');
                // In a real app, you would send credentials to the backend here
                // and redirect upon successful authentication.
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);
            } else {
                alert('Nama pengguna dan kata sandi diperlukan.');
            }
        });
    </script>
</body>
</html>
